[project]
name = "petoi-walk"
version = "0.0.0"
description = "Petoi Bittle driven by Jev (reasoning) and a fly-brain simulation (reflex)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = [
    "hypothesis>=6.100",
    "mypy>=1.11",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/petoi_walk"]

# --- ruff: docs/rules/static-analysis.md ---
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
include = ["*.py", "*.pyi"]

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "B", "UP", "SIM", "RUF", "PT", "ASYNC", "S", "N", "ANN", "TID",
    "PGH",  # blanket noqa / type: ignore without a code
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

# --- mypy ---
[tool.mypy]
strict = true
python_version = "3.11"
files = ["src", "tests"]
warn_unused_ignores = true
enable_error_code = ["ignore-without-code"]
mypy_path = "src"
explicit_package_bases = true

# --- pytest: docs/rules/testing.md ---
[tool.pytest.ini_options]
testpaths = ["tests"]
# jev / hardware tests are skipped unless --run-jev / --run-hardware is given (tests/conftest.py).
# Coverage is measured by scripts/check.sh, not here, so a single test file can be run alone.
addopts = ["--strict-markers", "--import-mode=importlib"]
markers = [
    "jev: calls the real TypeSafe Jev API (needs an API key; not run in CI)",
    "hardware: drives a real Bittle (run by a human; results go to experimentals/)",
]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["error"]
xfail_strict = true

[tool.coverage.run]
branch = true
source = ["petoi_walk"]

[tool.coverage.report]
fail_under = 80
show_missing = true
