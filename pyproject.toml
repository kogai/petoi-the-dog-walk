[project]
name = "petoi-walk"
version = "0.0.0"
description = "Petoi Bittle driven by Jev (reasoning) and a fly-brain simulation (reflex)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = [
    "hypothesis>=6.100",
    "mypy>=1.11",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/petoi_walk"]

# --- ruff: docs/rules/static-analysis.md ---
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
include = ["*.py", "*.pyi"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF", "PT", "ASYNC", "S", "N", "ANN", "TID"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

# --- mypy ---
[tool.mypy]
strict = true
python_version = "3.11"
files = ["src", "tests"]
warn_unused_ignores = true

# --- pytest: docs/rules/testing.md ---
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
    "--strict-markers",
    "-m", "not jev and not hardware",
    "--cov=petoi_walk",
    "--cov-branch",
    "--cov-report=term-missing",
]
markers = [
    "jev: calls the real TypeSafe Jev API (needs an API key; not run in CI)",
    "hardware: drives a real Bittle (run by a human; results go to experimentals/)",
]
asyncio_mode = "auto"
xfail_strict = true

[tool.coverage.report]
fail_under = 80
