[workspace]
resolver = "3"
members = ["crates/*", "xtask"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.94"
license = "MIT"
publish = false

[workspace.dependencies]
walk-core = { path = "crates/walk-core" }
proptest = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
serialport = { version = "4", default-features = false }
ctrlc = { version = "3", features = ["termination"] }

# Panics must unwind so that Drop can send the stop token (docs/design/02-architecture.md §5).
[profile.dev]
panic = "unwind"

[profile.release]
panic = "unwind"

# Lint policy: docs/rules/static-analysis.md. Every crate sets `[lints] workspace = true`.
[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"
unused_must_use = "deny"
unreachable_pub = "deny"
rust_2018_idioms = { level = "deny", priority = -1 }

[workspace.lints.clippy]
pedantic = { level = "deny", priority = -1 }
# Failures are values, not panics (docs/rules/coding.md §3). Tests are exempt via clippy.toml.
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
indexing_slicing = "deny"
# Enum matches must stay exhaustive.
wildcard_enum_match_arm = "deny"
# Output goes through logging; binaries opt out with #![expect(..., reason = "...")].
print_stdout = "deny"
print_stderr = "deny"
dbg_macro = "deny"
# Lint exceptions must be #[expect(..., reason = "...")], never #[allow].
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
