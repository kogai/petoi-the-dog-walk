name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      # mise installs the tools pinned in mise.toml (Rust with its components, cargo-llvm-cov).
      - uses: jdx/mise-action@v2
        with:
          cache: true
      - uses: Swatinem/rust-cache@v2
      - run: mise run check
